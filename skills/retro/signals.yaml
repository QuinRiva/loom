# Retro signal catalogue — read by scripts/retro_scan.py.
#
# kind:    structural (a named check over session/manifest data) | phrase (a regex)
# scope:   phrase signals: thinking | assistant | report | tool_error
#          structural signals: session | manifest
# pattern: phrase signals only — a Python regex, matched case-insensitively
# check:   structural signals only — the named check in retro_scan.py; params tune it
# status:  seed | promoted | retired — retired entries are never scanned; they stay
#          here so no future retro re-adds them
# origin:  which retro (or design pass) added or last changed the entry
#
# Hit counts live in each run's scan.json, never here (see retro_signal_stats.py).

signals:
  # ── structural: free, precise, see what the parent cannot ──────────────────
  - id: tool-error
    kind: structural
    scope: session
    check: tool_error
    params: { outlier_min: 5 }
    why: Tool calls that failed — environment, permission or capability friction the child may never report. Grouped by normalised signature in the digest; a thread with outlier_min or more is an outlier.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: repeated-call
    kind: structural
    scope: session
    check: repeated_call
    params: { outlier_min: 10 }
    why: Identical tool name + arguments issued more than once — a thread fighting a tool or polling. Counts calls minus distinct (name, args) pairs.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: turn-outlier
    kind: structural
    scope: session
    check: turn_outlier
    params: { factor: 2, min_role_size: 3 }
    why: Turns or cost above factor × the median for the role (roles with at least min_role_size threads) or for the whole tree — work that was harder, or went worse, than its peers.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: control-decision
    kind: structural
    scope: manifest
    check: control_decision
    why: A yield, hold, rework round, wedge/error/deadlock notice or synthesised report — the control plane had to intervene. Taken from the manifest's last decision plus the control-plane notices the parent received.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: missing-tool
    kind: structural
    scope: session
    check: missing_tool
    params: { roles: [coder, assessor, reviewer], tools: [bash, edit] }
    why: A thread launched without a tool its role needs to verify its own work (e.g. an assessor that cannot run lint).
    origin: retro-redesign design scan (2026-10)
    status: seed

  # ── trace checks: one session at a time, tool-call structure only (scripts/loom-evals/trace_corpus.py runs them weekly) ──
  - id: killed-then-silent
    kind: structural
    scope: session
    check: killed_then_silent
    why: "A bash call exited 137 or 143 or hit the bash tool's own `Command timed out after`, or a bg_wait reported its job killed, and the turn then ended with no further tool call (and so no workstream_submit). Census category 6: a child stalled after a killed command. Variants: exit 137/143, timed out, bg job killed. A user message after the kill also ends the run, so a human interrupt is a known false positive."
    origin: loom-evals plan (2026-11)
    status: seed

  - id: merge-bypass
    kind: structural
    scope: session
    check: merge_bypass
    why: "A bash command ran `gh pr merge` in a session whose cwd (or project root) has .t3code/ship.json, and no command in the session ran `pnpm ship`. Census category 3: a merge around the guarded ship procedure."
    origin: loom-evals plan (2026-11)
    status: seed

  - id: failed-then-publish
    kind: structural
    scope: session
    check: failed_then_publish
    why: "A bash command with an mv, cp or git segment exited non-zero, and later in the same run (before the next user message) `pnpm ship` or `gh pr create` was called with no `git status` between. Census category 3 (T38: a failed mv published working documents)."
    origin: loom-evals plan (2026-11)
    status: seed

  - id: write-outside-worktree
    kind: structural
    scope: session
    check: write_outside_worktree
    why: "An edit or write to an absolute path outside the session's cwd, /tmp, ~/loom-retro, ~/loom-evals and any .artifacts/ directory. Census category 3. Low precision expected: grow the allow-list from the first-20 review."
    origin: loom-evals plan (2026-11)
    status: seed

  - id: instruction-edit-ungated
    kind: structural
    scope: session
    check: instruction_edit_ungated
    why: "An edit or write to roles/*.md, .t3code/roles/, skills/*/SKILL.md or an AGENTS.md, in a session with no read of the llm-instruction-change SKILL.md and whose thread no reviewer gate loops back to. Census category 11."
    origin: loom-evals plan (2026-11)
    status: seed

  - id: visual-unseen
    kind: structural
    scope: session
    check: visual_unseen
    why: "An edit or write to apps/web/**/*.tsx (only when the new text carries className, style, <div or <span), *.css, *.html or a README.md, then a workstream_submit (or the session's end) with no html_preview, preview_*, browser_* or device_* call and no read of a .png in between. Census category 9."
    origin: loom-evals plan (2026-11)
    status: seed

  - id: tests-claimed-not-run
    kind: structural
    scope: session
    check: tests_claimed_not_run
    why: "A coder's or reviewer's report claims verified / tests pass / typecheck passes / vp check passes and no bash or bg_start command ran the test class (vp check|test|run typecheck…, vitest, pytest, lint-doc.sh, …); variant `command failed` when every such bash call failed. Also `shipped claimed`: the report says shipped or merged and no pnpm ship, gh pr merge or git push ran. Census category 8. A phrase match, allowed only paired with the absence of a command."
    origin: loom-evals plan (2026-11)
    status: seed

  - id: moved-text-unwritten
    kind: structural
    scope: session
    check: moved_text_unwritten
    why: "A report line claims text was moved, added or written to a path in inline code, and the session has no edit or write to that path and no bash command naming the file (a git mv counts as a write). Census category 8 (T34), in its tool-call form: the report claim is paired with the absence of a write."
    origin: loom-evals plan (2026-11)
    status: seed

  - id: forbidden-git
    kind: structural
    scope: session
    check: forbidden_git
    why: "A bash command segment runs `git add -A|--all|.`, `git stash` (not list or show) or `git push` naming main or master. The command is split on ; && || | and newlines and each segment must start with git, so a commit message mentioning the words does not count."
    origin: loom-evals plan (2026-11)
    status: seed

  - id: kill-by-pattern
    kind: structural
    scope: session
    check: kill_by_pattern
    why: "A bash command segment starts with pkill, or kill fed by $(pgrep|pidof|ps …), or pgrep piped into xargs kill. A bare pgrep listing and kill $(cat pidfile) do not count. guard-fired counts the block; this counts the attempt."
    origin: loom-evals plan (2026-11)
    status: seed

  - id: sleep-poll
    kind: structural
    scope: session
    check: sleep_poll
    why: "Three or more bash calls in one session contain `sleep <n>`. Variant: whether any of them watches gh pr, gh run or checks (a watch tool existed). Census T13 is the 120-second foreground sleep."
    origin: loom-evals plan (2026-11)
    status: seed

  - id: file-reread
    kind: structural
    scope: session
    check: file_reread
    why: "A read or read_full with identical (path, offset, limit) arguments four or more times. Paging with different offsets is not a hit."
    origin: loom-evals plan (2026-11)
    status: seed

  - id: unasked-commit
    kind: structural
    scope: session
    check: unasked_commit
    why: "A bash segment runs git commit in a reviewer, researcher, planner, assessor or root session whose kickoff (first user turn) does not mention commit. Coders and shippers are asked to commit by their role text and are excluded."
    origin: loom-evals plan (2026-11)
    status: seed

  - id: guard-fired
    kind: structural
    scope: session
    check: guard_fired
    why: "A tool result where a Loom guard spoke: starts `Blocked by the t3 <name> guard`, starts `Refused:`, or carries an appended `[t3 <name> guard]` note. Variants split blocks, refusals, rewrites and other notes."
    origin: loom-evals plan (2026-11)
    status: seed

  # ── phrase: first-person, tool-facing tells; grow by evidence only ─────────
  - id: admits-mistake
    kind: phrase
    scope: thinking
    pattern: '\bI (?:reali[sz]e|notice)d?,? (?:that )?(?:I|my)\b[^.\n]{0,80}?\b(?:mistake|wrong|accidentally|misread|forgot)|\bmy mistake\b|\bI (?:made a mistake|accidentally|misread)\b'
    why: The agent caught itself in an error — what tripped it is often a guidance or tooling gap. The object must be the agent ("I realize I…", "my…"); "I notice the deed cites the wrong lease" is subject matter.
    origin: retro-redesign design scan (2026-10); narrowed to first-person objects by the scanner build (4 of 5 hits on a lease-review tree were subject matter)
    status: seed

  - id: tool-unavailable
    kind: phrase
    scope: thinking
    pattern: '\b(?:don''t|do not) have (?:a |an |any )?(?:bash|shell|edit|execution|browser) ?(?:tool|access)|\bno (?:bash|shell|edit|execution|browser) (?:tool|access)\b|\bI can''t run\b'
    why: The thread lacked a capability its task needed. The looser "I can't" over-fires and is excluded.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: tool-puzzlement
    kind: phrase
    scope: thinking
    pattern: '(?:\bpuzzl\w*|\bit(?:''s| is) (?:strange|odd|weird)|\bunexpectedly)[^.\n]{0,120}?\b(?:bash|read tool|edit tool|rg|tool|browser|screenshot|command|consult|submit|workstream_\w+)\b'
    why: The agent found a tool behaving inconsistently (e.g. bash and Read seeing different /tmp). Requires a tool named after the puzzlement; unqualified "odd" fires on CSS.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: deferred-not-fixed
    kind: phrase
    scope: thinking
    pattern: '\b(?:flag|note|mention) (?:it|this|that) in (?:the|my) report\b|\brather than fix(?:ing)? it\b'
    why: A scope decision to report rather than fix — worth checking whether the issue was ever picked up.
    origin: retro-redesign design scan (2026-10); "out of scope here" dropped by the scanner build (reviewers use it to bound their review, 21 hits in 15 threads on the Pull 9 tree)
    status: seed

  - id: brief-mismatch
    kind: phrase
    scope: thinking
    pattern: '\b(?:even though|although|though|but|while) (?:the|my) brief (?:says|said|asks|asked|assumes|assumed|claims|claimed)\b|\b(?:the|my) brief (?:says|said|assumes|assumed|claims|claimed)\b[^.\n]{0,100}?\b(?:but|however|yet|wrong|stale|doesn''t|does not|isn''t|no longer|actually)\b|\b(?:the|my) brief (?:is|was) (?:wrong|stale|mistaken|outdated)\b|\bcontrary to the brief\b|\bbrief error\b'
    why: The child found its brief wrong, stale or in tension with the code or other guidance — the brief-quality signal. Requires a contrast word near "the brief says"; the bare form was mostly restatements ("since the brief says not to commit").
    origin: retro-redesign design scan (2026-10); narrowed by the scanner build after 11 hits on the HTML-vs-MDX tree were mostly restatements
    status: seed

  - id: guidance-conflict
    kind: phrase
    scope: thinking
    pattern: '\b(?:the|this) (?:skill|runbook|SKILL\.md|role file|AGENTS\.md|docs?)(?: instructions?)? (?:says?|said|tells? me)\b[^.\n]{0,120}?\b(?:conflict|contradict\w*|stale|outdated|no longer)\b|\bthere(?:''s| is) a conflict here\b|\b(?:SKILL\.md|skill|runbook|role file)\b[^.\n]{0,40}?\bstale (?:prose|docs?|instructions?|lines?)\b'
    why: Guidance the agent is following (skill, runbook, role file, AGENTS.md) contradicts the tool, the policy or the code — the guidance-found-wanting signal that brief-mismatch cannot see. Requires a contrast word, not a bare "the skill says".
    origin: retro 2026-10-19-update-pi-to-1-3-0-and-check-new-models
    status: seed

  - id: call-refused
    kind: phrase
    scope: tool_error
    pattern: '^Refused:|\bno route matched\b|\bmatched no route\b'
    why: The control plane refused a call (e.g. a submit refused for an attention flag the thread never raised). Precise because it is scoped to error results.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: report-departure
    kind: phrase
    scope: report
    pattern: '\bdepart(?:ed|ure|ing) from (?:the |your |my )?brief\b|\b(?:could not|couldn''t|unable to|did not|didn''t) (?:verify|run|test)\b|\blimitation\b|\bblocked (?:by|on)\b'
    why: A report admitting a departure from the brief, an unverified claim or a blocker — a place the parent may have read past.
    origin: retro-redesign design scan (2026-10)
    status: seed

  # ── retired: over-fire on subject matter or planning language ──────────────
  - id: bare-wait
    kind: phrase
    scope: thinking
    pattern: '\bwait\b'
    why: Planning filler; fires hundreds of times per tree.
    origin: retro-redesign design scan (2026-10)
    status: retired

  - id: bare-actually
    kind: phrase
    scope: thinking
    pattern: '\bactually\b'
    why: Planning filler; part of the 900-hit should/actually/instead set.
    origin: retro-redesign design scan (2026-10)
    status: retired

  - id: should-have
    kind: phrase
    scope: thinking
    pattern: '\bshould have\b'
    why: Mostly hypotheticals about the code under work, not self-correction.
    origin: retro-redesign design scan (2026-10)
    status: retired

  - id: bare-instead
    kind: phrase
    scope: thinking
    pattern: '\binstead\b'
    why: Ordinary design-choice language; no friction signal.
    origin: retro-redesign design scan (2026-10)
    status: retired

  - id: refus-anywhere
    kind: phrase
    scope: thinking
    pattern: "refus"
    why: Fired 19 times in one thread whose subject was Loom's refusal semantics. Kept only as call-refused, scoped to tool errors.
    origin: retro-redesign design scan (2026-10)
    status: retired

  - id: context-tokens
    kind: phrase
    scope: thinking
    pattern: '\b(?:context|tokens)\b'
    why: Fires on any thread about context budgets or token costs; subject matter, not friction.
    origin: retro-redesign design scan (2026-10)
    status: retired
