# Retro signal catalogue — read by scripts/retro_scan.py.
#
# kind:    structural (a named check over session/manifest data) | phrase (a regex)
# scope:   phrase signals: thinking | assistant | report | tool_error
#          structural signals: session | manifest
# pattern: phrase signals only — a Python regex, matched case-insensitively
# check:   structural signals only — the named check in retro_scan.py; params tune it
# status:  seed | promoted | retired — retired entries are never scanned; they stay
#          here so no future retro re-adds them
# narrowed: trace checks only — "<date>: <what the review found and what changed>" after a
#          first-20 review (~/loom-evals/reviews/<id>.json); the dashboard prints the date
# origin:  which retro (or design pass) added or last changed the entry
#
# Hit counts live in each run's scan.json, never here (see retro_signal_stats.py).

signals:
  # ── structural: free, precise, see what the parent cannot ──────────────────
  - id: tool-error
    kind: structural
    scope: session
    check: tool_error
    params: { outlier_min: 5 }
    why: Tool calls that failed — environment, permission or capability friction the child may never report. Grouped by normalised signature in the digest; a thread with outlier_min or more is an outlier.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: repeated-call
    kind: structural
    scope: session
    check: repeated_call
    params: { outlier_min: 10 }
    why: Identical tool name + arguments issued more than once — a thread fighting a tool or polling. Counts calls minus distinct (name, args) pairs.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: turn-outlier
    kind: structural
    scope: session
    check: turn_outlier
    params: { factor: 2, min_role_size: 3 }
    why: Turns or cost above factor × the median for the role (roles with at least min_role_size threads) or for the whole tree — work that was harder, or went worse, than its peers.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: control-decision
    kind: structural
    scope: manifest
    check: control_decision
    why: A yield, hold, rework round, wedge/error/deadlock notice or synthesised report — the control plane had to intervene. Taken from the manifest's last decision plus the control-plane notices the parent received.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: missing-tool
    kind: structural
    scope: session
    check: missing_tool
    params: { roles: [coder, assessor, reviewer], tools: [bash, edit] }
    why: A thread launched without a tool its role needs to verify its own work (e.g. an assessor that cannot run lint).
    origin: retro-redesign design scan (2026-10)
    status: seed

  # ── trace checks: one session at a time, tool-call structure only (scripts/loom-evals/trace_corpus.py runs them weekly) ──
  - id: killed-then-silent
    kind: structural
    scope: session
    check: killed_then_silent
    why: "A bash call exited 137 or 143 or hit the bash tool's own `Command timed out after`, or a bg_wait reported its job killed, and the model then wrote an assistant message (it saw the kill) and ended its turn with no further tool call, before the next user message or the session's end. Census category 6: a child stalled after a killed command. Variants: exit 137/143, timed out, bg job killed. A kill followed straight by a user message, with no assistant message between, is a turn that died with the server (restart, redeploy, relaunch), not one that went quiet, and is not counted."
    origin: loom-evals plan (2026-11)
    narrowed: "2026-11-02: first-20 review 1 of 9. All 8 false positives were turns that died with the server (the kill result followed directly by a restart notice, resume or kickoff); now requires an assistant message between the kill and the next user message. The one true positive (a coder killing its own bg_start process group, which shares pi's) also died without an assistant message, so it is no longer counted either: that is a Loom bug, not this check."
    status: seed

  - id: merge-bypass
    kind: structural
    scope: session
    check: merge_bypass
    why: "A bash command step runs `gh pr merge` (not --help) against a repository with .t3code/ship.json and a `ship` package script (only loom today), and no command step in the session runs `pnpm ship`. The repository is the one `-R/--repo` names (matched against the session cwd's and project root's origin), else the step's `cd` target, else the session cwd or project root. Steps split outside quotes, $( ) and heredoc bodies, so a commit message mentioning the words does not count. Census category 3: a merge around the guarded ship procedure."
    origin: loom-evals plan (2026-11)
    narrowed: "2026-11-02: first-20 review 4 of 10. Four false positives merged in another repository (loom-slack-bridge, pi-fathom, pi-browser) while the check tested the session's; one was `gh pr merge --help`; one was text inside a multi-line commit message. Now resolves the repository from -R/--repo or the cd target, skips --help and does not split inside quotes; on the reviewed 10 that keeps 4 of 4."
    status: seed

  - id: failed-then-publish
    kind: structural
    scope: session
    check: failed_then_publish
    why: "A bash command whose last step (the step its exit code belongs to; after the last ; && || | or newline) is a mutating git command (add, commit, mv, rm, rebase, merge, cherry-pick, checkout, switch, reset, push, stash, worktree), mv or cp exited non-zero, and later in the same run (before the next user message) `pnpm ship` or `gh pr create` ran with no `git status` and no successful rerun of that step between. Census category 3 (T38: a failed mv published working documents)."
    origin: loom-evals plan (2026-11)
    narrowed: "2026-11-02: first-20 review 0 of 15. In 14 the non-zero exit belonged to a read-only last step (cat, grep, ls, tail, git log) while another step merely started with git; one real commit failure was recovered by rerunning the commit, which only `git status` cleared. Now reads the last step only, requires it to mutate, and clears on a successful rerun. Retire it if the next first-20 is still under 50%."
    status: seed

  - id: write-outside-worktree
    kind: structural
    scope: session
    check: write_outside_worktree
    why: "An edit or write to an absolute path outside the session's cwd, /tmp, ~/loom-retro, ~/loom-evals and any .artifacts/ directory, that lands inside another git repository (nearest ancestor with a .git entry, read at scan time, compared by common git directory, so another worktree of the session's own repository, such as one a coder made with git worktree add, does not count) or inside a live install (~/.pi/agent, ~/.t3/cockpit/userdata). Variants: another repository, live install. Census category 3."
    origin: loom-evals plan (2026-11)
    narrowed: "2026-11-02: first-20 review 6 of 20. All 14 false positives were writes to folders that are no git repository (~/scratch, ~/data, ~/.agent/diagrams, ~/.t3/qa-pull9, ~/loom-releases). Now counts only writes into another repository or a live install, which keeps the 6 true positives (pi-fathom and cli-proxy checkouts, the installed pi-browser extension)."
    status: seed

  - id: instruction-edit-ungated
    kind: structural
    scope: session
    check: instruction_edit_ungated
    why: "An edit or write to roles/*.md, .t3code/roles/, skills/*/SKILL.md or an AGENTS.md, from 2026-10-12 09:55 UTC (when the llm-instruction-change skill merged; before it there was no protocol to load), in a session with no read of an llm-instruction-change*/SKILL.md (any project's variant; the read tool, or cat, sed or head in bash) and whose thread no reviewer gate loops back to, unless the session later spawned or scaffolded a reviewer whose arguments name the edited file (roles/x.md, skills/x/SKILL.md, AGENTS.md). Census category 11."
    origin: loom-evals plan (2026-11)
    narrowed: "2026-11-02: first-20 review 14 of 20, passes. Small fixes: any llm-instruction-change*/SKILL.md read counts (one hit had read pi-fathom's variant); edits before the skill existed are not counted (4 hits); a fork's copied-in history is not scanned again (1 hit, for every trace check). Second review 12 of 20: 5 false positives loaded the protocol with cat or sed, 2 had a reviewer spawned over the edit by the editing root; both now count (12 of 12 kept)."
    status: seed

  - id: visual-unseen
    kind: structural
    scope: session
    check: visual_unseen
    why: "An edit or write to apps/web/**/*.tsx (only when the new text carries className, style, <div or <span), *.css or *.html, then a workstream_submit (or the session's end) with no html_preview, preview_*, browser_* or device_* call and no read of a .png in between, in a root or planner session only. Census category 9. A child coder's or reviewer's unrendered edit follows its brief and AGENTS.md (subagents do not launch dev servers unless their brief says to), so other roles are not counted."
    origin: loom-evals plan (2026-11)
    narrowed: "2026-11-02: first-20 review 0 of 20, all README.md edits (98 of the 122 hits). README.md dropped: it is no rendered UI surface. 2026-11-02 second review 5 of 20: 10 of the 15 false positives were child coders whose brief gave the live check to another thread, forbade a browser or did not ask for one; now roots and planners only (5 of 6 on that sample)."
    status: seed

  - id: tests-claimed-not-run
    kind: structural
    scope: session
    check: tests_claimed_not_run
    why: "A coder's or reviewer's report claims tests pass(ed) / typecheck passes / vp check passes and no bash or bg_start command ran the test class (vp check|test|run typecheck…, vitest, pytest, python -m unittest|pytest, unittest discover, node --test, make test, node_modules/.bin/vp through a variable, lint-doc.sh, …); variant `command failed` when every such bash call failed. Census category 8. A phrase match, allowed only paired with the absence of a command."
    origin: loom-evals plan (2026-11)
    narrowed: "2026-11-02: first-20 review 0 of 20. 16 were the bare `verified` claim (88 of the 111 hits), which names reading code, not a test run; 2 were the `shipped` claim describing someone else's merge; 2 reviewers had run `python -m unittest`, missing from the command class. Dropped `verified` and the shipped claim, added python -m unittest|pytest, unittest discover, node --test and make test. Retire it if the next first-20 is still under 50%. Retired the same day: narrowed, it hit 1 session in October 1 to November 1, a reviewer restating that the coder's tests passed."
    status: retired

  - id: moved-text-unwritten
    kind: structural
    scope: session
    check: moved_text_unwritten
    why: "A report line claims text was moved, added or written to a path in inline code, and the session has no edit or write to that path and no bash command naming the file (a git mv counts as a write). Census category 8 (T34), in its tool-call form: the report claim is paired with the absence of a write."
    origin: loom-evals plan (2026-11)
    narrowed: '2026-11-02: retired after the first-20 review, 0 of 7. Every hit was third-person or negated description ("upstream moved them to", "nothing written to … yet", a branch name); the phrase cannot tell a claim of one''s own write from reporting.'
    status: retired

  - id: forbidden-git
    kind: structural
    scope: session
    check: forbidden_git
    why: "A bash command step runs `git stash` (not list or show) or `git push` naming main or master, except a push in a command that builds a scratch repository (mktemp, git init). The command is split on ; && || | and newlines outside quotes, $( ) and heredoc bodies, and each step must start with git, so a commit message mentioning the words does not count. Variants: git stash, git push to main."
    origin: loom-evals plan (2026-11)
    narrowed: "2026-11-02: first-20 review 6 of 20; all 6 true positives were git stash. `git add -A` was 103 of the 120 hits and all 14 reviewed were false (per-thread worktrees of early October, or the workbench scratch repository), so it is no longer reported; 2 of the 3 push-to-main hits were a test fixture's mktemp bare repository."
    status: seed

  - id: kill-by-pattern
    kind: structural
    scope: session
    check: kill_by_pattern
    why: "A bash command step starts with pkill carrying a pattern, or kill fed by $(pgrep|pidof|ps …) other than `ps -o pgid= -p <pid>` (a captured PID) or `ps -eo pid=,pgid=|sid= | awk` (the documented dev-verify kill over a captured group, docs/dev-site-testing.md §6), or pgrep piped into xargs kill; `pkill -P <pid>` (children of a known parent) and --help steps are skipped. Steps split outside quotes, $( ) and heredoc bodies, so a grep for 'pgrep\\|pkill' does not count. A bare pgrep listing and kill $(cat pidfile) do not count. guard-fired counts the block; this counts the attempt."
    origin: loom-evals plan (2026-11)
    narrowed: "2026-11-02: first-20 review 12 of 20, passes. Fixed the three false-positive shapes: `kill -TERM -$(ps -o pgid= -p $PID)` (a captured PID), pkill as an alternative inside a quoted grep pattern, pkill --help (and a heredoc's script text). Second review 11 of 20: the 9 false positives were the dev-verify recipe's own `ps -eo pid=,pgid= | awk` kill and `pkill -P <pid>`, both now skipped (11 of 11 kept)."
    status: seed

  - id: sleep-poll
    kind: structural
    scope: session
    check: sleep_poll
    why: "Two or more bash calls in one session, which had bg_start in its tool set, run `sleep <n>` with n of 5 or more (shorter is settle time) and then, in the same command, probe what they wait on: `gh pr` or `gh run` (watch_pull_request existed), a bg_start job log (…/jobs/*.log; bg_wait with timeout_s reports it), or `ps … -p` or `wc` on a running job's output. A command that backgrounds (&, setsid, nohup) or kills a process is settling, not polling, and a bare `sleep N` is a wait between UI actions that bg_wait cannot replace. Variant: the commonest probe. Census T13 is the 120-second foreground sleep."
    origin: loom-evals plan (2026-11)
    narrowed: "2026-11-02: first-20 review 16 of 20, passes, but none of the 20 sessions had bg_start (it arrived about 8 October), so the polling had no non-blocking alternative. Now counts only sessions that had bg_start, and skips sleeps in a command that backgrounds a process (the 4 false positives). 2026-11-02 second review 5 of 20: 15 false positives were bare sleeps between browser actions, waits on a setsid dev server's /tmp log and settle sleeps after a kill. Now counts only a sleep followed in its command by a probe, two or more per session (all 5 true positives have two or more; `ls` after a sleep was dropped as a probe, since it appeared only in false positives)."
    status: seed

  - id: file-reread
    kind: structural
    scope: session
    check: file_reread
    why: "A read or read_full with identical (path, offset, limit) arguments four or more times; images are excluded, since a re-rendered screenshot is re-read by design. Paging with different offsets is not a hit."
    origin: loom-evals plan (2026-11)
    narrowed: "2026-11-02: retired after the first-20 review, 0 of 1: one hit in a month, a root re-reading a child's report that had been rewritten between reads."
    status: retired

  - id: unasked-commit
    kind: structural
    scope: session
    check: unasked_commit
    why: "A bash step runs git commit in a reviewer, researcher, planner, assessor or root session, and the commit lands in a repository outside the session's own worktree (the step's -C or cd directory, nearest ancestor with a .git entry, compared by common git directory: another worktree of the same repository, as a reviewer's inline fix in its coder's worktree, a scratch repository nested in the worktree such as workbench, one under /tmp, or one the command builds with mktemp or git init are not counted) or, in the session's own checkout, on main/master (git's own `[main abc1234]` result line) of a main checkout (a .git directory, not a worktree). Coders and shippers are asked to commit by their role text and are excluded. A `cd` inside a ( … ) subshell ends with the subshell."
    origin: loom-evals plan (2026-11)
    narrowed: "2026-11-02: first-20 review 1 of 20. Asks to fix, implement or ship imply a commit and usually come after the kickoff, so the kickoff-mentions-commit test was the wrong proxy (14 roots); reviewers commit inline fixes under fixed_inline (4). Now counts only a commit in another repository or on main of a main checkout, which keeps the one true positive (a root committing in Carl's /home/Carl/pi-fathom checkout). Second review 2 of 4: one false positive carried a subshell's cd into the next git commit, now fixed."
    status: seed

  - id: guard-fired
    kind: structural
    scope: session
    check: guard_fired
    why: "A tool result where a Loom guard spoke: starts `Blocked by the t3 <name> guard`, starts `Refused:`, or ends with the text block a guard appends (`\\n\\n[t3 <name> guard] …`). Variants split blocks, refusals, rewrites and other notes."
    origin: loom-evals plan (2026-11)
    narrowed: "2026-11-02: first-20 review 16 of 20, passes. The 4 false positives read files that quote the marker (searchGuard.ts and its test, a report on an instruction guard that does not exist); a note now counts only as the guard's own trailing text block."
    status: seed

  # ── phrase: first-person, tool-facing tells; grow by evidence only ─────────
  - id: admits-mistake
    kind: phrase
    scope: thinking
    pattern: '\bI (?:reali[sz]e|notice)d?,? (?:that )?(?:I|my)\b[^.\n]{0,80}?\b(?:mistake|wrong|accidentally|misread|forgot)|\bmy mistake\b|\bI (?:made a mistake|accidentally|misread)\b'
    why: The agent caught itself in an error — what tripped it is often a guidance or tooling gap. The object must be the agent ("I realize I…", "my…"); "I notice the deed cites the wrong lease" is subject matter.
    origin: retro-redesign design scan (2026-10); narrowed to first-person objects by the scanner build (4 of 5 hits on a lease-review tree were subject matter)
    status: seed

  - id: tool-unavailable
    kind: phrase
    scope: thinking
    pattern: '\b(?:don''t|do not) have (?:a |an |any )?(?:bash|shell|edit|execution|browser) ?(?:tool|access)|\bno (?:bash|shell|edit|execution|browser) (?:tool|access)\b|\bI can''t run\b'
    why: The thread lacked a capability its task needed. The looser "I can't" over-fires and is excluded.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: tool-puzzlement
    kind: phrase
    scope: thinking
    pattern: '(?:\bpuzzl\w*|\bit(?:''s| is) (?:strange|odd|weird)|\bunexpectedly)[^.\n]{0,120}?\b(?:bash|read tool|edit tool|rg|tool|browser|screenshot|command|consult|submit|workstream_\w+)\b'
    why: The agent found a tool behaving inconsistently (e.g. bash and Read seeing different /tmp). Requires a tool named after the puzzlement; unqualified "odd" fires on CSS.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: deferred-not-fixed
    kind: phrase
    scope: thinking
    pattern: '\b(?:flag|note|mention) (?:it|this|that) in (?:the|my) report\b|\brather than fix(?:ing)? it\b'
    why: A scope decision to report rather than fix — worth checking whether the issue was ever picked up.
    origin: retro-redesign design scan (2026-10); "out of scope here" dropped by the scanner build (reviewers use it to bound their review, 21 hits in 15 threads on the Pull 9 tree)
    status: seed

  - id: brief-mismatch
    kind: phrase
    scope: thinking
    pattern: '\b(?:even though|although|though|but|while) (?:the|my) brief (?:says|said|asks|asked|assumes|assumed|claims|claimed)\b|\b(?:the|my) brief (?:says|said|assumes|assumed|claims|claimed)\b[^.\n]{0,100}?\b(?:but|however|yet|wrong|stale|doesn''t|does not|isn''t|no longer|actually)\b|\b(?:the|my) brief (?:is|was) (?:wrong|stale|mistaken|outdated)\b|\bcontrary to the brief\b|\bbrief error\b'
    why: The child found its brief wrong, stale or in tension with the code or other guidance — the brief-quality signal. Requires a contrast word near "the brief says"; the bare form was mostly restatements ("since the brief says not to commit").
    origin: retro-redesign design scan (2026-10); narrowed by the scanner build after 11 hits on the HTML-vs-MDX tree were mostly restatements
    status: seed

  - id: guidance-conflict
    kind: phrase
    scope: thinking
    pattern: '\b(?:the|this) (?:skill|runbook|SKILL\.md|role file|AGENTS\.md|docs?)(?: instructions?)? (?:says?|said|tells? me)\b[^.\n]{0,120}?\b(?:conflict|contradict\w*|stale|outdated|no longer)\b|\bthere(?:''s| is) a conflict here\b|\b(?:SKILL\.md|skill|runbook|role file)\b[^.\n]{0,40}?\bstale (?:prose|docs?|instructions?|lines?)\b'
    why: Guidance the agent is following (skill, runbook, role file, AGENTS.md) contradicts the tool, the policy or the code — the guidance-found-wanting signal that brief-mismatch cannot see. Requires a contrast word, not a bare "the skill says".
    origin: retro 2026-10-19-update-pi-to-1-3-0-and-check-new-models
    status: seed

  - id: call-refused
    kind: phrase
    scope: tool_error
    pattern: '^Refused:|\bno route matched\b|\bmatched no route\b'
    why: The control plane refused a call (e.g. a submit refused for an attention flag the thread never raised). Precise because it is scoped to error results.
    origin: retro-redesign design scan (2026-10)
    status: seed

  - id: report-departure
    kind: phrase
    scope: report
    pattern: '\bdepart(?:ed|ure|ing) from (?:the |your |my )?brief\b|\b(?:could not|couldn''t|unable to|did not|didn''t) (?:verify|run|test)\b|\blimitation\b|\bblocked (?:by|on)\b'
    why: A report admitting a departure from the brief, an unverified claim or a blocker — a place the parent may have read past.
    origin: retro-redesign design scan (2026-10)
    status: seed

  # ── retired: over-fire on subject matter or planning language ──────────────
  - id: bare-wait
    kind: phrase
    scope: thinking
    pattern: '\bwait\b'
    why: Planning filler; fires hundreds of times per tree.
    origin: retro-redesign design scan (2026-10)
    status: retired

  - id: bare-actually
    kind: phrase
    scope: thinking
    pattern: '\bactually\b'
    why: Planning filler; part of the 900-hit should/actually/instead set.
    origin: retro-redesign design scan (2026-10)
    status: retired

  - id: should-have
    kind: phrase
    scope: thinking
    pattern: '\bshould have\b'
    why: Mostly hypotheticals about the code under work, not self-correction.
    origin: retro-redesign design scan (2026-10)
    status: retired

  - id: bare-instead
    kind: phrase
    scope: thinking
    pattern: '\binstead\b'
    why: Ordinary design-choice language; no friction signal.
    origin: retro-redesign design scan (2026-10)
    status: retired

  - id: refus-anywhere
    kind: phrase
    scope: thinking
    pattern: "refus"
    why: Fired 19 times in one thread whose subject was Loom's refusal semantics. Kept only as call-refused, scoped to tool errors.
    origin: retro-redesign design scan (2026-10)
    status: retired

  - id: context-tokens
    kind: phrase
    scope: thinking
    pattern: '\b(?:context|tokens)\b'
    why: Fires on any thread about context budgets or token costs; subject matter, not friction.
    origin: retro-redesign design scan (2026-10)
    status: retired
